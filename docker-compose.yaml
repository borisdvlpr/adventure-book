services:
  postgres:
    image: postgres:18-alpine
    container_name: adventurebook-postgres18
    environment:
      POSTGRES_DB: adventurebook
      POSTGRES_USER: adventurebook
      POSTGRES_PASSWORD: changemeinprod!
    ports:
      - "5432:5432"
    volumes:
      - adventurebook-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U adventurebook -d adventurebook" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: adventurebook-redis
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --save
      - ""
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  adventurebook-data:
