name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  IMAGE_NAME: docker.io/b0risdvlpr/adventurebook
  JAVA_VERSION: "25"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test
        uses: ./.github/actions/test

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Package
        run: ./mvnw -B -C -DskipTests package

      - name: Stage release artefacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          # The pom version does not track git tags, so the jar is named after the
          # tag on the way out. Making the pom itself follow the tag would mean
          # versions-maven-plugin or a ${revision} property — a deliberate omission.
          cp target/adventurebook-*.jar "dist/adventurebook-${version}.jar"
          cd dist
          sha256sum ./* > checksums.txt

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=adventurebook
            org.opencontainers.image.description=Choose-your-own-adventure book catalogue and game engine.
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            JAVA_VERSION=${{ env.JAVA_VERSION }}
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A semver prerelease carries a hyphen after the version core
          # (v1.2.0-rc.1), which is GoReleaser's `prerelease: auto` rule.
          prerelease=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease="--prerelease"
          fi

          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ${prerelease} \
            dist/*
