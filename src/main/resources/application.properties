spring.application.name=adventurebook

# postgres database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/adventurebook
spring.datasource.username=adventurebook
spring.datasource.password=changemeinprod!

# jpa configuration
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms

# flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# openapi / swagger-ui
# UI at http://localhost:8080/swagger-ui.html, description at /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# Collapse the schema list on load; the operations are the point of the page.
springdoc.swagger-ui.defaultModelsExpandDepth=-1

# actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=Adventure Book
